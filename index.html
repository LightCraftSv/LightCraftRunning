<title>LightCraft | لایت کرفت</title>

<style>
:root{--fg:#fff;--gold:#f5c96a;--pur:#a855f7;box-sizing:border-box}
html,body{height:100%;margin:0;color:var(--fg);font-family:Vazirmatn,Tahoma,sans-serif;background:#07030f}
body{background:radial-gradient(circle at 50% 38%,#7c3aed,#2e1065 38%,#07030f 78%) fixed;min-height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
main{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 16px;gap:6px}
#logo{width:min(70vw,38vh,360px);border-radius:22px;box-shadow:0 0 70px var(--pur);margin-bottom:10px}
.fa{font-weight:800;text-shadow:0 0 16px var(--pur);line-height:1.6}
.en{direction:ltr;font-weight:500;opacity:.8;line-height:1.4}
.name .fa{font-size:clamp(24px,6vmin,42px);color:var(--gold)}
.name .en{font-size:clamp(15px,3.6vmin,24px)}
.title{margin-top:clamp(18px,5vh,44px)}
.title .fa{font-size:clamp(20px,5vmin,36px)}
.title .en{font-size:clamp(13px,3vmin,20px)}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(6px,2vw,16px);direction:ltr;width:min(94vw,560px);margin-top:18px}
.box{background:rgba(0,0,0,.35);border:2px solid var(--gold);border-radius:14px;padding:12px 4px}
.num{font-size:clamp(26px,8vmin,56px);font-weight:800;color:var(--gold);line-height:1.1;font-variant-numeric:tabular-nums}
.box .fa{font-size:clamp(12px,2.8vmin,20px)}
.box .en{font-size:clamp(10px,2.2vmin,15px)}
#done{display:none}
</style></head><body>

<script>
const LAUNCH=new Date(2027,5,22,0,0,0); // 22 June 2027 (1 Tir 1406) - change here
const $=id=>document.getElementById(id),fa=n=>n.toLocaleString('fa-IR');
function tick(){
  let ms=LAUNCH-new Date();
  if(ms<=0){$('row').style.display='none';$('done').style.display='block';return}
  const sec=Math.floor(ms/1000);
  $('d').textContent=fa(Math.floor(sec/86400));
  $('h').textContent=fa(Math.floor(sec%86400/3600));
  $('m').textContent=fa(Math.floor(sec%3600/60));
  $('s').textContent=fa(sec%60);
}
tick();setInterval(tick,1000);
const cv=$('c'),x=cv.getContext('2d');let P=[],W,H;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);
for(let i=0;i<80;i++)P.push({x:Math.random(),y:Math.random(),r:Math.random()*2+.5,v:Math.random()*.0007+.0002});
(function f(){x.clearRect(0,0,W,H);x.fillStyle='rgba(245,201,106,.8)';for(const p of P){p.y-=p.v;if(p.y<0)p.y=1;x.beginPath();x.arc(p.x*W,p.y*H,p.r,0,7);x.fill()}requestAnimationFrame(f)})();
</script></body></html>
